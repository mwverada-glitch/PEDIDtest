<style>
    .contact-section {
    background: #7d65ab;
    padding: 60px 0;
}

.contact-container {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    display: flex;
    gap: 40px;
}

.contact-form {
    flex: 1;
    background: #7d65ab;
    border-radius: 20px;
    padding: 30px;
    color: white;
    border: 3px solid white;
}

.contact-form h2 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 20px;
}

.contact-form input,
.contact-form select,
.contact-form textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 25px;
    border: none;
    font-size: 16px;
}

.file-box {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.file-text {
    flex: 1;
}

.file-btn {
    background: #D8BFD8;
    padding: 15px 15px;
    border-radius: 25px;
    color: white;
    cursor: pointer;
}

textarea {
    height: 120px;
    border-radius: 15px !important;
    resize: none;
}

.submit-btn {
    width: 100%;
    background: #D8BFD8;
    color: white;
    padding: 12px;
    border-radius: 25px;
    border: none;
    font-size: 18px;
    margin-top: 10px;
    cursor: pointer;
}

.submit-btn:hover {
    background: lightblue;
}

.contact-info {
    flex: 1;
    color: white;
    padding-top: 40px;
}

.contact-info h3 {
    margin-top: 20px;
    font-size: 20px;
}

.social-icons{
    display:flex;
    gap:15px;
    margin:25px 0;
}

.social-icons a{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#bfb3db;      /* ม่วง */
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    font-size:22px;
    transition:.3s;
}

.social-icons a:hover{
    background:#b794f4;
    color:#fff;
    transform:translateY(-3px);
}
</style>


<script>
/*search*/
document.querySelector(".search").addEventListener("click", function() {
    let box = document.getElementById("searchBar");
    box.style.display = (box.style.display === "flex") ? "none" : "flex";
});

function searchFunction() {
    let keyword = document.getElementById("searchInput").value.trim();
    if (keyword === "") {
        alert("กรุณาพิมพ์คำที่ต้องการค้นหา");
        return;
    }
    alert("ค้นหา: " + keyword);
}
