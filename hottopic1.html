<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Hot Topics1</title>
<link rel="stylesheet" href="style_14.7.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
<script src="search-data.js"></script>
<script src="search.js"></script>
</head>
<style>
.dropdown-wrapper {
    position: relative;
}
.dropdown-wrapper:hover .dropdown-menu {
    display: block;
}</style>

<div id="header"></div>

<script>
fetch("header.html")
.then(res => res.text())
.then(data => {
    document.getElementById("header").innerHTML = data;
});
</script>


<style>
.news-content {
    max-width: 1200px;          /* ⭐ กว้างขึ้นจาก 900 → 1200 */
    margin: 60px auto;
    background: #ffffff;
    padding: 40px 50px;         /* ⭐ ช่องว่างรอบข้อความเยอะขึ้น */
    border-radius: 20px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.10);
    font-family: "Prompt", sans-serif;
    text-align: center;
}

/* หัวข้อ */
.news-content h1 {
    font-size: 34px;            /* ใหญ่ขึ้นอีก */
    font-weight: 700;
    color: #0a2e5c;
    margin-bottom: 12px;
}

.news-content p {
    font-size: 18px;            /* ใหญ่ขึ้น */
    color: #3e4a5a;
    margin-bottom: 10px;
}

/* กรอบแสดง PDF */
.pdf-viewer {
    width: 100%;
    height: 1100px;             /* ⭐ ยาวขึ้นจาก 800 → 1100 */
    margin-top: 30px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

.pdf-viewer iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>

</head>
<body>

<div class="news-content">
    <h1>สถานการณ์โรคไข้หวัดนก (Avian influenza)</h1>
    <p>ข้อมูล ณ วันที่ 1 เมษายน 2569</p>
    <p>กองระบาดวิทยา กรมควบคุมโรค</p>

    <div class="pdf-viewer">
        <iframe 
            src="DOE_alert_avianinfluenza_01.04.2568.pdf" 
            frameborder="0">
        </iframe>
    </div>
</div>

<script>
function openModal(mode) {
    document.getElementById("popupModal").style.display = "flex";
    switchTab(mode);
}

/* --- CLOSE MODAL --- */
function closeModal() {
    document.getElementById("popupModal").style.display = "none";
}

/* --- TOGGLE PASSWORD --- */
function togglePassword(id) {
    let field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}

/* --- SWITCH TAB --- */
function switchTab(tab) {
    const loginTab = document.getElementById("tabLogin");
    const regTab = document.getElementById("tabRegister");
    const loginForm = document.getElementById("loginForm");
    const regForm = document.getElementById("registerForm");

    if (tab === "login") {
        loginTab.classList.add("active");
        regTab.classList.remove("active");
        loginForm.style.display = "block";
        regForm.style.display = "none";
    } else {
        regTab.classList.add("active");
        loginTab.classList.remove("active");
        loginForm.style.display = "none";
        regForm.style.display = "block";
    }
}

/* --- CLOSE WHEN CLICK OUTSIDE --- */
window.onclick = function(event) {
    const modal = document.getElementById("popupModal");
    if (event.target === modal) closeModal();
};


// ----- CLOSE POPUP WHEN CLICK OUTSIDE -----
window.onclick = function(event) {
    let loginModal = document.getElementById("loginModal");
    let regModal = document.getElementById("registerModal");

    if (event.target === loginModal) loginModal.style.display = "none";
    if (event.target === regModal) regModal.style.display = "none";
};

/*search*/
document.querySelector(".search").addEventListener("click", function() {
    let box = document.getElementById("searchBar");
    box.style.display = (box.style.display === "flex") ? "none" : "flex";
});

function searchFunction() {
    let keyword = document.getElementById("searchInput").value.trim();
    if (keyword === "") {
        alert("กรุณาพิมพ์คำที่ต้องการค้นหา");
        return;
    }
    alert("ค้นหา: " + keyword);
}
</script>

</body>
</html>
