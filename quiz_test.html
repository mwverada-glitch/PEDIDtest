<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>quiz_test</title>
<link rel="stylesheet" href="style_14.7.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
<script src="search-data.js"></script>
<script src="search.js"></script>
</head>
<style>
.dropdown-wrapper {
    position: relative;
}
.dropdown-wrapper:hover .dropdown-menu {
    display: block;
}</style>

<div id="header"></div>

<script>
fetch("header.html")
.then(res => res.text())
.then(data => {
    document.getElementById("header").innerHTML = data;
});
</script>


<style>
.quiz-card i {
    font-style: italic;
}
.icon{
    display: block;
    width: 400px;
    height: 300px;
    object-fit: contain;   /* แสดงรูปครบ */
    margin: 0 auto 15px;
    border-radius: 18px;
}
body{font-family:Arial,sans-serif;background:#0d0d10}
.quiz-flashcard{width:650px;max-width:95%;margin:30px auto;perspective:1200px;position:relative;min-height:760px}
.card{position:absolute;top:0;left:0;width:100%;background:#fff;padding:24px;border-radius:24px;box-shadow:0 10px 25px rgba(0,0,0,.15);backface-visibility:hidden;transition:.7s}
.back{transform:rotateY(180deg);text-align:center}
.flip .front{transform:rotateY(-180deg)}
.flip .back{transform:rotateY(0)}
.progress{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin-bottom:15px}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#7c4ae8,#39b39c);transition:.4s}
.question-number{font-weight:bold;color:#666;margin:10px 0}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{padding:12px;border-radius:14px;border:2px solid #c8b9ff;background:#efeaff;cursor:pointer;color:#000;  }
.choice.selected{background:#c6ffe5;border-color:#39b39c}
button{padding:12px 24px;border:none;border-radius:25px;background:linear-gradient(135deg,#7c4ae8,#39b39c);color:#fff;cursor:pointer;margin-top:18px}
.explanation{display:none;margin-top:15px;background:#f8f8ff;padding:15px;border-left:5px solid #7c4ae8;text-align:left;border-radius:10px}
</style>

<body>
<div class="quiz-flashcard">
<div class="card front">
<div class="progress"><div class="progress-bar"></div></div>
<div class="question-number"></div>
<img class="icon">
<h3 class="question"></h3>
<div class="choices"></div>
<button class="next-btn">Check Answer</button>
</div>
<div class="card back">
<h2 class="result-text"></h2>
<div class="explanation"></div>
<button class="retry-btn">Next Question</button>
</div>
</div>
<script>
const quizData = [
{
    image:"S__56098818.jpg",
    question:"A 4-month-old infant is brought to the hospital with a left supraclavicular mass. The child has a history of recurrent infections. Physical examination reveals a left supraclavicular mass near the BCG vaccination scar. There is no known exposure to tuberculosis. Which of the following is the most likely causative pathogen?",
    choices:[
        "A. <i>Staphylococcus aureus</i>",
        "B. <i>Mycobacterium tuberculosis</i>",
        "C. <i>Mycobacterium bovis</i> (BCG strain)",
        "D. <i>Bartonella henselae</i>",
        "E. <i>Nocardia asteroides</i>"
    ],
    answer:"C",
    explanation:"BCG lymphadenitis is caused by the BCG vaccine strain of <i>Mycobacterium bovis</i>."
},
{
    image:"messageImage_1782372761096.jpg",
    question:"Preterm female newborn, GA 35 weeks presented with hepatosplenomegaly and skin rash (as picture). What is the most likely diagnosis?",
    choices:[
        "A. Congenital syphilis",
        "B. Congenital CMV infection",
        "C. Congenital toxoplasmosis",
        "D. Congenital herpes infection",
        "E. Congenital rubella syndrome"
    ],
    answer:"A",
    explanation:"Congenital syphilis."
}
];

let current = 0;
let score = 0;
let userChoice = null;

const card = document.querySelector(".quiz-flashcard");

loadQuestion();

function loadQuestion(){

    const q = quizData[current];

    document.querySelector(".icon").src = q.image;
    document.querySelector(".question").textContent = q.question;
    document.querySelector(".question-number").textContent =
        `Question ${current + 1} / ${quizData.length}`;

    document.querySelector(".progress-bar").style.width =
        ((current + 1) / quizData.length * 100) + "%";

    const box = document.querySelector(".choices");
    box.innerHTML = "";

    q.choices.forEach((choice,index)=>{

        const btn = document.createElement("button");

        btn.className = "choice";
        btn.innerHTML = choice;

        btn.dataset.choice = String.fromCharCode(65 + index);

        btn.onclick = ()=>{

            document.querySelectorAll(".choice").forEach(c=>{
                c.classList.remove("selected");
            });

            btn.classList.add("selected");

            userChoice = btn.dataset.choice;

        }

        box.appendChild(btn);

    });

    document.querySelector(".result-text").textContent="";
    document.querySelector(".explanation").style.display="none";

}

document.querySelector(".next-btn").onclick = function(){

    if(!userChoice){
        alert("Please select an answer.");
        return;
    }

    const q = quizData[current];

    const result = document.querySelector(".result-text");

    if(userChoice===q.answer){

        score++;

        result.textContent="Correct ✔";
        result.style.color="#39b39c";

    }else{

        result.textContent="Incorrect ✖";
        result.style.color="#d9534f";

    }

    const explanation=document.querySelector(".explanation");

    explanation.style.display="block";
    explanation.textContent=q.explanation;

    card.classList.add("flip");

}

document.querySelector(".retry-btn").onclick = function(){

    card.classList.remove("flip");

    current++;

    userChoice=null;

    if(current >= quizData.length){

        document.querySelector(".front").style.display="none";
        document.querySelector(".back").style.transform="rotateY(0deg)";

        document.querySelector(".result-text").innerHTML=
        `🎉 Quiz Completed!<br><br>Your Score<br><br>${score} / ${quizData.length}`;

        document.querySelector(".explanation").style.display="none";

        this.textContent="Restart Quiz";

        this.onclick=restartQuiz;

        return;
    }

    loadQuestion();

}

function restartQuiz(){

    current=0;
    score=0;
    userChoice=null;

    document.querySelector(".front").style.display="block";

    this.textContent="Next Question";

    this.onclick=function(){

        card.classList.remove("flip");

        current++;

        userChoice=null;

        if(current>=quizData.length){

            document.querySelector(".front").style.display="none";

            document.querySelector(".result-text").innerHTML=
            `🎉 Quiz Completed!<br><br>Your Score<br><br>${score} / ${quizData.length}`;

            document.querySelector(".explanation").style.display="none";

            this.textContent="Restart Quiz";

            this.onclick=restartQuiz;

            return;

        }

        loadQuestion();

    };

    card.classList.remove("flip");

    loadQuestion();

}


function openModal(mode) {
    document.getElementById("popupModal").style.display = "flex";
    switchTab(mode);
}

/* --- CLOSE MODAL --- */
function closeModal() {
    document.getElementById("popupModal").style.display = "none";
}

/* --- TOGGLE PASSWORD --- */
function togglePassword(id) {
    let field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}

/* --- SWITCH TAB --- */
function switchTab(tab) {
    const loginTab = document.getElementById("tabLogin");
    const regTab = document.getElementById("tabRegister");
    const loginForm = document.getElementById("loginForm");
    const regForm = document.getElementById("registerForm");

    if (tab === "login") {
        loginTab.classList.add("active");
        regTab.classList.remove("active");
        loginForm.style.display = "block";
        regForm.style.display = "none";
    } else {
        regTab.classList.add("active");
        loginTab.classList.remove("active");
        loginForm.style.display = "none";
        regForm.style.display = "block";
    }
}

/* --- CLOSE WHEN CLICK OUTSIDE --- */
window.onclick = function(event) {
    const modal = document.getElementById("popupModal");
    if (event.target === modal) closeModal();
};


// ----- CLOSE POPUP WHEN CLICK OUTSIDE -----
window.onclick = function(event) {
    let loginModal = document.getElementById("loginModal");
    let regModal = document.getElementById("registerModal");

    if (event.target === loginModal) loginModal.style.display = "none";
    if (event.target === regModal) regModal.style.display = "none";
};
/*search*/
document.querySelector(".search").addEventListener("click", function() {
    let box = document.getElementById("searchBar");
    box.style.display = (box.style.display === "flex") ? "none" : "flex";
});

function searchFunction() {
    let keyword = document.getElementById("searchInput").value.trim();
    if (keyword === "") {
        alert("กรุณาพิมพ์คำที่ต้องการค้นหา");
        return;
    }
    alert("ค้นหา: " + keyword);
}


</script>

</body></html>
